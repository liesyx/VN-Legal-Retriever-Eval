# Admin cụm chạy 1 lần — phần Jenkins (quyền trong namespace) không tạo được:
#   kubectl apply -f helm/observability/cluster-rbac.yaml
# 1) namespace observability + cho SA Jenkins (demo:jenkins-deployer) quyền admin trong đó, giống namespace legal-rag
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: observability
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin }
subjects:
  - { kind: ServiceAccount, name: jenkins-deployer, namespace: demo }
---
# 2) Prometheus đọc pod/node toàn cụm + cAdvisor (cấp cụm nên phải do admin tạo)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observability-prometheus
rules:
  - apiGroups: [""]
    resources: [pods, nodes]             # tìm pod có annotation prometheus.io/scrape, tìm node để đọc cAdvisor
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes/proxy, nodes/metrics]   # CPU/RAM từng container qua kubelet
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: observability-prometheus
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: observability-prometheus }
subjects:
  - { kind: ServiceAccount, name: prometheus, namespace: observability }
