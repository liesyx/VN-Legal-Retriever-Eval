apiVersion: v1
kind: ConfigMap
metadata:
  name: loki
data:
  loki.yaml: |
    {{- include "obs.lokiConfig" . | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass }}
  resources: { requests: { storage: {{ .Values.loki.storage }} } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels: { app: loki }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: loki } }
  template:
    metadata:
      labels: { app: loki }
      annotations:
        checksum/config: {{ include "obs.lokiConfig" . | sha256sum | trunc 12 }}
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: loki
          image: {{ .Values.loki.image }}
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports:
            - { name: http, containerPort: 3100 }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          resources:
            {{- toYaml .Values.loki.resources | nindent 12 }}
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /loki }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: config, configMap: { name: loki } }
        - { name: data, persistentVolumeClaim: { claimName: loki } }
---
apiVersion: v1
kind: Service
metadata:
  name: loki              # API gửi log: http://loki.observability:3100/otlp/v1/logs
  labels: { app: loki }
spec:
  selector: { app: loki }
  ports: [{ name: http, port: 3100, targetPort: http }]
