{{- if .Values.headlamp.enabled }}
{{- $h := .Values.headlamp }}
# Headlamp: UI web cho k8s (thay Kubernetes Dashboard đã bị archive), Jenkins deploy cùng chart này — không cần vào server.
# Tự đăng nhập bằng SA "headlamp" (-unsafe-use-service-account-token) => AI CÓ URL LÀ CÓ QUYỀN CỦA SA:
# bắt buộc chặn domain bằng basic auth ở proxy Coolify (README, mục V.3).
# Quyền chỉ nằm trong các namespace ở headlamp.namespaces (Jenkins là admin ở đó nên tự tạo được Role/RoleBinding);
# không có quyền cấp cụm (node, danh sách namespace) — Jenkins không cấp được, Headlamp vẫn chạy, chỉ báo thiếu quyền ở trang tổng quan.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp
  labels: { app: headlamp }
{{- range $ns := $h.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headlamp-view          # xem mọi tài nguyên trong namespace, trừ Secret
  namespace: {{ $ns }}
  labels: { app: headlamp }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view }
subjects:
  - { kind: ServiceAccount, name: headlamp, namespace: {{ $.Release.Namespace }} }
{{- if $h.operate }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: headlamp-operate
  namespace: {{ $ns }}
  labels: { app: headlamp }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]                                  # xoá pod để Deployment tạo lại
  - apiGroups: [""]
    resources: [pods/exec, pods/portforward]
    verbs: [create, get]                             # terminal vào container (đọc được env, kể cả API key)
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [patch]                                   # restart
  - apiGroups: [apps]
    resources: [deployments/scale, statefulsets/scale]
    verbs: [get, patch, update]                      # scale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headlamp-operate
  namespace: {{ $ns }}
  labels: { app: headlamp }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: headlamp-operate }
subjects:
  - { kind: ServiceAccount, name: headlamp, namespace: {{ $.Release.Namespace }} }
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  labels: { app: headlamp }
spec:
  replicas: 1
  selector: { matchLabels: { app: headlamp } }
  template:
    metadata:
      labels: { app: headlamp }
    spec:
      serviceAccountName: headlamp
      securityContext: { runAsNonRoot: true, runAsUser: 100, runAsGroup: 101, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: headlamp
          image: {{ $h.image }}
          args:
            - -in-cluster
            - -plugins-dir=/headlamp/plugins
            - -unsafe-use-service-account-token     # không phải dán token: dùng quyền của SA headlamp ở trên
          ports:
            - { name: http, containerPort: 4466 }
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          resources:
            {{- toYaml $h.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  labels: { app: headlamp }
spec:
  type: NodePort
  selector: { app: headlamp }
  ports:
    - { name: http, port: 80, targetPort: http, nodePort: {{ $h.nodePort }} }
{{- end }}
