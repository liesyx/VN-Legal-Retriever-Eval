# Jenkins truyền image.tag; giá trị khác sửa ở đây rồi push
image:
  repository: harbor.oci.lexsy.pro.vn/legal-rag/api
  tag: ""
imagePullSecrets:
  - name: harbor-pull

replicas: 1

# Phiên bản dữ liệu: collection phapdien_<version> trên Qdrant + bảng từ s3://<bucket>/data/phapdien_<version>/bm25_vocab.json.gz
# Lên bản dữ liệu mới / quay lại = đổi dòng này, commit -> pipeline deploy (hoặc helm rollback).
data:
  version: v1

# Model trên MinIO
model:
  embedding: models/vietnamese-embedding/main
  reranker: models/vietnamese-reranker/main   # chỉ tải khi rerank.enabled

rerank:
  enabled: false        # true: +~2,3 GB RAM, chậm hơn nhiều trên CPU

qdrant:
  url: https://qdrant.oci.lexsy.pro.vn

s3:
  endpoint: https://s3.oci.lexsy.pro.vn
  bucket: legal-rag

# Secret tạo tay 1 lần (không nằm trong git/Jenkins), cần các key:
#   QDRANT_API_KEY (key chỉ đọc), API_TOKEN, S3_ACCESS_KEY, S3_SECRET_KEY (user MinIO chỉ đọc bucket)
existingSecret: legal-rag-secrets

# initContainer tải model + bảng từ từ MinIO
fetchImage: rclone/rclone:1.68.2

resources:
  requests: { cpu: 500m, memory: 3Gi }   # máy 2 CPU: rolling update cần chỗ cho 2 pod cùng lúc
  limits: { cpu: "2", memory: 4Gi }

# Cụm tắt Traefik: Coolify proxy (HTTPS, domain) -> http://<IP node>:<nodePort> -> pod
service:
  nodePort: 30081

# /ask cho giao diện web: backend chuyển câu hỏi sang n8n
ask:
  n8nWebhook: https://n8n.oci.lexsy.pro.vn/webhook/legal-ask
  allowedOrigins: https://legal.oci.lexsy.pro.vn,http://localhost:5500
  perMinute: 10

# Giao diện web: Coolify route https://legal.oci.lexsy.pro.vn -> http://10.0.0.47:30082
web:
  enabled: true
  repository: harbor.oci.lexsy.pro.vn/legal-rag/web    # Jenkins build cùng tag với image API
  nodePort: 30082

# Trace/log/metrics -> chart helm/observability (namespace observability, cài tay 1 lần — xem README)
# false: API chạy như cũ, không gửi gì ra ngoài.
observability:
  enabled: true
  tracesEndpoint: http://jaeger.observability:4318/v1/traces
  logsEndpoint: http://loki.observability:3100/otlp/v1/logs
  metricsPort: 9100

# CỔNG CHẤT LƯỢNG (MLOps) — Job chạy trước mỗi lần deploy (templates/eval-job.yaml):
# đánh giá bộ câu hỏi chuẩn trên đúng cấu hình sắp lên, ghi MLflow, không đạt -> không deploy.
# Chỉ chạy lại khi cấu hình đổi (data.version, model, rerank, golden); đổi code thì dùng kết quả cũ trong MLflow.
quality:
  enabled: false                      # bật (true) cùng lúc đổi data.version sang bản do notebook Kaggle đẩy lên
                                      # (lúc đó MinIO mới có bộ câu hỏi chuẩn; thiếu file thì Job lỗi -> không deploy được)
  golden: eval/golden_v1.jsonl.gz     # trên MinIO bucket s3.bucket — tạo bằng: python -m mlops.golden qrels.parquet ...
  minNdcg10: 0.40                     # benchmark: hybrid 0,428 trên 494 câu test (không rerank)
  maxDrop: 0.01                       # được tụt tối đa 0,01 so với champion (nhiễu đo ~±0,02 với 494 câu)
  sample: 0                           # 0 = toàn bộ 494 câu; đặt 150 nếu máy quá chậm
  timeoutSeconds: 1800
  mlflow:
    uri: https://mlflow.oci.lexsy.pro.vn
    experiment: legal-rag-retrieval
    model: legal-rag-retriever        # Model Registry: alias "candidate" (đạt cổng) -> "champion" (đã lên production)
  resources:
    requests: { cpu: 250m, memory: 2Gi }   # chạy song song pod API cũ: request nhỏ, limit cho dùng hết CPU rảnh
    limits: { cpu: "2", memory: 4Gi }
