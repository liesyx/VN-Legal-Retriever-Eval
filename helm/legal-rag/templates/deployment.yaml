{{- if not .Values.image.tag }}{{ fail "image.tag là bắt buộc (Jenkins truyền --set image.tag=...)" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "legal-rag.labels" . | nindent 4 }}
    app.kubernetes.io/version: {{ .Values.image.tag | quote }}
spec:
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }   # pod mới sẵn sàng rồi mới tắt pod cũ
  selector:
    matchLabels:
      {{- include "legal-rag.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "legal-rag.labels" . | nindent 8 }}
      {{- if .Values.observability.enabled }}
      annotations:                         # Prometheus (chart observability) tự tìm pod có annotation này
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.observability.metricsPort | quote }}
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        {{- include "legal-rag.fetch" (dict "root" . "golden" false) | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
            {{- if .Values.observability.enabled }}
            - { name: metrics, containerPort: {{ .Values.observability.metricsPort }} }   # chỉ Prometheus trong cụm đọc, không qua NodePort
            {{- end }}
          env:
            {{- include "legal-rag.retrieverEnv" . | nindent 12 }}
            - { name: N8N_WEBHOOK_URL, value: {{ .Values.ask.n8nWebhook | quote }} }
            - { name: ALLOWED_ORIGINS, value: {{ .Values.ask.allowedOrigins | quote }} }
            - { name: ASK_PER_MINUTE, value: {{ .Values.ask.perMinute | quote }} }
            {{- with .Values.observability }}{{ if .enabled }}
            - { name: METRICS_PORT, value: {{ .metricsPort | quote }} }
            - { name: OTEL_SERVICE_NAME, value: legal-rag-api }
            - { name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT, value: {{ .tracesEndpoint | quote }} }
            - { name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT, value: {{ .logsEndpoint | quote }} }
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),deployment.environment=dev" }
            {{- end }}{{ end }}
            - name: API_TOKEN
              valueFrom: { secretKeyRef: { name: {{ .Values.existingSecret }}, key: API_TOKEN } }
          startupProbe:          # nạp model trên CPU mất 30–90 s
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: models
          emptyDir: { sizeLimit: {{ ternary "6Gi" "3Gi" .Values.rerank.enabled }} }
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
